*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 16px 10vh;
  background:#0b0b0e radial-gradient(ellipse 120% 70% at 50% 0%,#2b1411 0%,rgba(11,11,14,0) 62%) no-repeat;
  color:#f3f1ec;
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.wrap{width:100%;max-width:720px}
.stage{
  position:relative;
  width:100%;
  height:0;
  padding-top:56.25%;
  border-radius:14px;
  overflow:hidden;
  background:#000;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
}
.screen,.poster{position:absolute;top:0;left:0;width:100%;height:100%}
.screen{background:#000}
.screen iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
.poster{
  z-index:2;
  display:block;
  margin:0;
  padding:0;
  border:0;
  border-radius:0;
  background:#000;
  color:#fff;
  font:inherit;
  cursor:pointer;
  overflow:hidden;
  -webkit-appearance:none;
  appearance:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:opacity .28s ease;
}
.poster span{position:absolute;display:block}
.poster .bg{
  top:-12%;
  left:-12%;
  width:124%;
  height:124%;
  background:var(--p) center/cover no-repeat;
  -webkit-filter:blur(22px) brightness(.5) saturate(1.2);
  filter:blur(22px) brightness(.5) saturate(1.2);
}
.poster .art{
  top:0;
  left:21.875%;
  width:56.25%;
  height:100%;
  background:var(--p) center/cover no-repeat;
  box-shadow:0 0 46px rgba(0,0,0,.7);
}
.poster .veil{
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.1) 0%,rgba(0,0,0,.42) 100%);
}
.poster .play{
  top:50%;
  left:50%;
  width:76px;
  height:76px;
  margin:-38px 0 0 -38px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.95);
  background:rgba(12,12,15,.55);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  box-shadow:0 6px 24px rgba(0,0,0,.45);
  transition:transform .18s ease,background-color .18s ease;
}
.play svg{
  position:absolute;
  top:50%;
  left:50%;
  width:30px;
  height:30px;
  margin:-15px 0 0 -12.5px;
  fill:#fff;
  transition:fill .18s ease;
}
@media (hover:hover){
  .poster:hover .play{transform:scale(1.07);background:rgba(255,255,255,.96)}
  .poster:hover .play svg{fill:#121215}
}
.poster:focus-visible{outline:none}
.poster:focus-visible .play{box-shadow:0 0 0 4px rgba(255,255,255,.9),0 6px 24px rgba(0,0,0,.45)}
.poster.is-busy{cursor:progress}
.poster.is-busy .play,
.poster.is-busy:hover .play{
  background:rgba(12,12,15,.55);
  border-color:rgba(255,255,255,.22);
  border-top-color:#fff;
  -webkit-animation:spin .8s linear infinite;
  animation:spin .8s linear infinite;
}
.poster.is-busy .play svg{display:none}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.stage.is-live .poster{opacity:0;pointer-events:none}
h1{margin:20px 2px 4px;font-size:1.375rem;line-height:1.25;font-weight:700;letter-spacing:.005em}
.meta{margin:0 2px;color:#a9a6ad;font-size:.95rem}
.help{margin:14px 2px 0;font-size:.9rem}
.help a{color:#d9d5ce;text-underline-offset:3px}
.note{
  margin:0 0 14px;
  padding:10px 12px;
  border:1px solid rgba(255,196,84,.4);
  border-radius:10px;
  background:rgba(255,196,84,.08);
  color:#ffd98a;
  font-size:.875rem;
}
@media (max-width:480px){
  .stage{border-radius:10px}
  .poster .play{width:62px;height:62px;margin:-31px 0 0 -31px}
  .play svg{width:24px;height:24px;margin:-12px 0 0 -10px}
  h1{margin-top:16px;font-size:1.2rem}
}
@media (max-height:560px) and (orientation:landscape){
  body{padding-top:12px;padding-bottom:16px}
  .wrap{max-width:calc((100vh - 120px) * 1.7778);min-width:300px}
  h1{margin-top:12px}
}
@media (prefers-reduced-motion:reduce){
  .poster,.poster .play,.play svg{transition:none}
  .poster.is-busy .play{-webkit-animation-duration:1.8s;animation-duration:1.8s}
}
</style>
</head>
<body>
<main class="wrap">
  <p class="note" id="note" hidden>Aperçu : d'ici, la vidéo ne peut pas se lancer dans la page. Elle le fera une fois la page en ligne (adresse en https) ; en attendant, le bouton l'ouvre dans un autre onglet.</p>
  <div class="stage" id="stage">
    <div class="screen" id="screen" inert aria-hidden="true"></div>
    <button class="poster" id="poster" type="button" aria-label="Lire la vidéo">
      <span class="bg"></span>
      <span class="art"></span>
      <span class="veil"></span>
      <span class="play"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3.5v17l14.5-8.5z"/></svg></span>
    </button>
  </div>
  <h1>Shaka Ponk</h1>
  <p class="meta">Clip vidéo · monte le son 🔊</p>
  <p class="help" id="help" hidden><a id="alt" target="_blank" rel="noopener noreferrer">La vidéo ne démarre pas ? L'ouvrir directement ↗</a></p>
  <noscript><p class="note" style="margin-top:14px">Cette page a besoin de JavaScript pour lire la vidéo.</p></noscript>
</main>
<script>
(function () {
  'use strict';
  var d = document, w = window;
  var stage = d.getElementById('stage');
  var screen = d.getElementById('screen');
  var poster = d.getElementById('poster');
  var note = d.getElementById('note');
  var help = d.getElementById('help');
  var alt = d.getElementById('alt');

  var q = [115, 77, 86, 18, 92, 9, 98, 93, 103, 39, 24], v = '', i;
  for (i = 0; i < q.length; i++) v += String.fromCharCode(q[i] ^ (23 + i * 5));

  var base = 'https://www.youtube.com';
  var walled = !/^https?:$/.test(location.protocol);
  var player = null;
  var ready = false;
  var asked = false;
  var fired = false;
  var shown = false;
  var broken = false;
  var down = false;
  var soft = 0, hard = 0;

  function link() {
    return base + '/watch?v=' + v;
  }

  function offer() {
    alt.setAttribute('href', link());
    help.removeAttribute('hidden');
  }

  function out() {
    offer();
    try { w.open(link(), '_blank', 'noopener'); } catch (e) {}
  }

  function wall() {
    walled = true;
    note.removeAttribute('hidden');
  }

  function plain() {
    var f = d.createElement('iframe');
    f.setAttribute('title', 'Lecteur vidéo');
    f.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    f.setAttribute('src', base + '/embed/' + v + '?autoplay=1&playsinline=1&rel=0');
    screen.innerHTML = '';
    screen.appendChild(f);
  }

  function reveal(ok) {
    if (shown) return;
    shown = true;
    clearTimeout(soft);
    clearTimeout(hard);
    stage.className += ' is-live';
    if (!ok) offer();
    setTimeout(function () {
      var held = d.activeElement === poster;
      var f = screen.getElementsByTagName('iframe')[0];
      if (poster.parentNode) poster.parentNode.removeChild(poster);
      if (held && f) { try { f.focus(); } catch (e) {} }
    }, 320);
  }

  function fire() {
    if (fired || !player) return;
    fired = true;
    try { player.playVideo(); } catch (e) {}
    soft = setTimeout(function () { reveal(false); }, 3000);
  }

  function lost() {
    down = true;
    if (asked && !shown) { plain(); reveal(false); }
  }

  function build() {
    if (player || shown || walled || !w.YT || !w.YT.Player) return;
    var slot = d.createElement('div');
    var vars = { playsinline: 1, rel: 0 };
    slot.id = 'lecteur';
    if (location.origin && location.origin !== 'null') vars.origin = location.origin;
    if (asked) vars.autoplay = 1;
    screen.innerHTML = '';
    screen.appendChild(slot);
    try {
      player = new w.YT.Player(slot, {
        width: '100%',
        height: '100%',
        videoId: v,
        playerVars: vars,
        events: {
          onReady: function () { ready = true; if (asked) fire(); },
          onStateChange: function (e) { if (asked && e && e.data === 1) reveal(true); },
          onAutoplayBlocked: function () { if (asked) reveal(false); },
          onError: function () { broken = true; if (asked) reveal(false); }
        }
      });
    } catch (e) {
      player = null;
      lost();
    }
  }

  function go() {
    if (walled) { out(); return; }
    if (asked) return;
    asked = true;
    screen.removeAttribute('inert');
    screen.removeAttribute('aria-hidden');
    if (broken) { out(); reveal(false); return; }
    if (down) { plain(); reveal(false); return; }
    poster.className += ' is-busy';
    poster.setAttribute('aria-busy', 'true');
    if (ready) fire();
    hard = setTimeout(function () {
      if (shown) return;
      if (!player) plain();
      reveal(false);
    }, 5000);
  }

  d.addEventListener('securitypolicyviolation', function (e) {
    if (/youtube/i.test((e && e.blockedURI) || '')) wall();
  }, false);

  poster.addEventListener('click', go, false);

  if (walled) {
    wall();
  } else {
    w.onYouTubeIframeAPIReady = build;
    var s = d.createElement('script');
    s.src = base + '/iframe_api';
    s.async = true;
    s.onerror = lost;
    d.head.appendChild(s);
  }
})();
</script>
